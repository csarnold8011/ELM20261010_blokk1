<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELM alapjai, 1. blokk</title>
<style>
:root{
  --bg:#f7f6f2;--card:#ffffff;--card2:#f0eee8;--text:#1f1e1b;--muted:#6b6963;--faint:#9a978f;--line:#dcd9d0;
  --accent:#534AB7;--accent-bg:#EEEDFE;--accent-text:#3C3489;
  --aru:#0F6E56;--aru-bg:#E1F5EE;--info:#534AB7;--penz:#BA7517;--penz-bg:#FAEEDA;
  --ok:#3B6D11;--ok-bg:#EAF3DE;--warn:#854F0B;--warn-bg:#FAEEDA;--danger:#A32D2D;--danger-bg:#FCEBEB;
  --bar:#AFA9EC;--bar-ok:#639922;--bar-valos:#D85A30;--new:#D85A30;--fs:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1b19;--card:#262624;--card2:#302f2c;--text:#ecebe6;--muted:#a3a19a;--faint:#7c7a74;--line:#3d3c38;
  --accent:#AFA9EC;--accent-bg:#3C3489;--accent-text:#EEEDFE;
  --aru:#5DCAA5;--aru-bg:#085041;--info:#AFA9EC;--penz:#EF9F27;--penz-bg:#633806;
  --ok:#97C459;--ok-bg:#27500A;--warn:#FAC775;--warn-bg:#633806;--danger:#F09595;--danger-bg:#791F1F;
  --bar:#534AB7;--bar-ok:#639922;--bar-valos:#F0997B;--new:#F0997B}}
:root[data-theme="dark"]{
  --bg:#1b1b19;--card:#262624;--card2:#302f2c;--text:#ecebe6;--muted:#a3a19a;--faint:#7c7a74;--line:#3d3c38;
  --accent:#AFA9EC;--accent-bg:#3C3489;--accent-text:#EEEDFE;
  --aru:#5DCAA5;--aru-bg:#085041;--info:#AFA9EC;--penz:#EF9F27;--penz-bg:#633806;
  --ok:#97C459;--ok-bg:#27500A;--warn:#FAC775;--warn-bg:#633806;--danger:#F09595;--danger-bg:#791F1F;
  --bar:#534AB7;--bar-ok:#639922;--bar-valos:#F0997B;--new:#F0997B}
:root.nagy{--fs:20px}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:8px;padding:.35rem .75rem}
button:hover{background:var(--card2)}
button:disabled{opacity:.5;cursor:default}
button.main{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] button.main{color:#1b1b19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.main{color:#1b1b19}}
button.on{background:var(--accent-bg);color:var(--accent-text);border-color:transparent}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;min-width:0}
textarea{resize:vertical}
.ico{display:inline-flex;align-items:center;justify-content:center;width:2.2rem;height:2.2rem;padding:0}
.ico svg{width:1.1rem;height:1.1rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.25rem}
.hint{font-size:.82rem;color:var(--muted)}
.ferr{color:var(--danger);font-size:.85rem;min-height:1.2em}
.empty{color:var(--muted);padding:2rem 0;text-align:center}
[hidden]{display:none!important}
h2,h3,h4{font-weight:600}

/* ---------- fejléc ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1360px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{font-weight:600;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
nav.fazis{display:flex;gap:.3rem;flex-wrap:wrap;flex:1}
nav.fazis button{border-color:transparent;color:var(--muted)}
nav.fazis button[aria-current="true"]{background:var(--accent-bg);color:var(--accent-text)}
nav.fazis .p{font-size:.75rem;opacity:.75;margin-left:.3rem}
.tools{display:flex;gap:.35rem;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--card);flex-wrap:wrap}
.seg button{border:none;border-radius:7px;padding:.35rem .8rem;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent-bg);color:var(--accent-text)}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;padding:.2rem .55rem;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.hiba{background:var(--danger-bg);color:var(--danger)}
.badge.ki{background:var(--card2);color:var(--muted)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
main.tanar{max-width:1360px;margin:0 auto;padding:1rem}
.statusline{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:0 0 .75rem}
.statusline .sp{flex:1}
.errline{color:var(--danger);font-size:.85rem;margin:-.25rem 0 .75rem}

/* ---------- beállítások ---------- */
#beall{margin-bottom:1rem}
#beall h2{font-size:1.05rem;margin:0 0 .75rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.75rem 1rem}
.form label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--muted)}
.form label.wide{grid-column:1/-1}
.formact{display:flex;gap:.5rem;align-items:center;margin-top:.75rem;flex-wrap:wrap}

/* ---------- 1. fázis ---------- */
.f1{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:860px){.f1{grid-template-columns:minmax(0,1fr)}}
.qrcard{text-align:center;position:sticky;top:5rem}
@media (max-width:860px){.qrcard{position:static}}
.qrbox{display:flex;justify-content:center;align-items:center;min-height:200px}
.qrfeher{background:#fff;padding:10px;border-radius:10px;display:inline-block}
.qrfeher img,.qrfeher canvas{display:block;max-width:100%;height:auto}
.qrurl{font-size:.7rem;color:var(--muted);word-break:break-all;margin-top:.5rem;max-height:3.2em;overflow:hidden}
.qrmsg{font-size:.85rem;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:.6rem;text-align:left}
.qrnums{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.75rem}
.qrnums div{background:var(--card2);border-radius:8px;padding:.45rem}
.qrnums b{display:block;font-size:1.5rem;line-height:1.1}
.qrnums span{font-size:.72rem;color:var(--muted)}
.vbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
.vbar .sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-bottom:1rem}
.tiles.t5{grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.tiles.t5 .v{font-size:1.4rem}
.tile{background:var(--card2);border-radius:10px;padding:.65rem 1rem}
.tile .l{font-size:.8rem;color:var(--muted)}
.tile .v{font-size:1.6rem;font-weight:600;line-height:1.2}
.tile .d{font-size:.8rem}
.tile .d.jo{color:var(--ok)}.tile .d.rossz{color:var(--danger)}
.cover{position:relative}
.cover.on>.covered{filter:blur(14px);opacity:.3;pointer-events:none;user-select:none}
.cover .veil{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;font-size:1.1rem;color:var(--muted)}
.cover.on .veil{display:flex}
.qchips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.qchips button{font-size:.8rem;padding:.25rem .55rem;border-radius:999px}
.qchips button[aria-current="true"]{background:var(--accent-bg);color:var(--accent-text);border-color:transparent}
.qchips .pc{color:var(--ok);margin-left:.3rem}
.qhead{display:flex;align-items:flex-start;gap:1rem;justify-content:space-between;flex-wrap:wrap}
.qtext{font-size:1.25rem;font-weight:600;line-height:1.35;margin:.25rem 0 1rem;flex:1;min-width:260px}
.qnav{display:flex;gap:.4rem;align-items:center}
.opts{display:grid;gap:.6rem}
.opt{display:grid;grid-template-columns:2rem minmax(0,1fr) 6.5rem;gap:.75rem;align-items:center}
.opt.nojel{grid-template-columns:minmax(0,1fr) 6.5rem}
.opt .betu{width:2rem;height:2rem;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:600}
.opt.helyes .betu{background:var(--ok-bg);color:var(--ok)}
.opt .tx{margin-bottom:.25rem}
.opt .track{height:.9rem;background:var(--card2);border-radius:5px;overflow:hidden}
.opt .track+.track{margin-top:3px}
.opt .track span{display:block;height:100%;background:var(--bar);transition:width .4s ease}
.opt.helyes .track span{background:var(--bar-ok)}
.opt .track.valos span{background:var(--bar-valos)}
.opt .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.opt .num b{color:var(--text);font-size:1.05rem}
.valosszam{color:var(--bar-valos);font-size:.8rem}
.magyar{margin-top:1rem;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:.8rem 1rem}
.magyar b{display:block;margin-bottom:.2rem}
.lb{display:grid;gap:.45rem}
.lbrow{display:grid;grid-template-columns:2.2rem minmax(0,12rem) minmax(0,1fr) 4.5rem 2rem;gap:.75rem;align-items:center}
.lbrow .rk{font-weight:600;color:var(--muted);text-align:right}
.lbrow.top .rk{color:var(--accent)}
.lbrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .track{height:1rem;background:var(--card2);border-radius:5px;overflow:hidden}
.lbrow .track span{display:block;height:100%;background:var(--bar)}
.lbrow.top .track span{background:var(--accent)}
.lbrow .pt{text-align:right;font-variant-numeric:tabular-nums}
.lbrow button{padding:.1rem .35rem;font-size:.75rem}
@media (max-width:600px){.lbrow{grid-template-columns:2rem minmax(0,1fr) 4rem 2rem}.lbrow .track{display:none}}
.cloudwrap{background:var(--card2);border-radius:12px;padding:.5rem;min-height:180px}
.cloudwrap svg{width:100%;height:auto;display:block}
.cloudwrap text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.cloudwrap text.sel{text-decoration:underline;fill:var(--new)!important}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:760px){.cmp{grid-template-columns:1fr}}
.cmp h4{margin:0 0 .4rem;font-size:.95rem;color:var(--muted);font-weight:500}
.legend{display:flex;gap:1rem;font-size:.85rem;color:var(--muted);margin-top:.5rem;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;vertical-align:-1px;margin-right:.35rem}

/* ---------- 2. fázis: elmélet ---------- */
.elm{display:grid;gap:1rem}
.lepesnav{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.lepesnav .pont{border-radius:999px;font-size:.85rem;padding:.3rem .75rem}
.lepesnav .pont[aria-current="true"]{background:var(--accent-bg);color:var(--accent-text);border-color:transparent}
.elmcim{font-size:1.6rem;margin:.2rem 0 .2rem;line-height:1.25}
.elmlead{font-size:1.15rem;color:var(--muted);margin:0 0 .5rem}
.tanulas .elmlead{color:var(--text)}
.ketoszlop{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:900px){.ketoszlop{grid-template-columns:minmax(0,1fr)}}
.szoveg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.15rem;line-height:1.6}
.szoveg h4{margin:0 0 .4rem}
.szoveg p{margin:.3rem 0 .6rem}
.szoveg .forras{font-size:.8rem;color:var(--muted)}
.idovonal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;position:relative}
.idovonal::before{content:"";position:absolute;left:0;right:0;top:1.35rem;height:3px;background:var(--line);z-index:0}
.korsz{position:relative;z-index:1;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.6rem .7rem}
.korsz .ev{font-size:.75rem;color:var(--muted)}
.korsz .nev{font-weight:600}
.korsz[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
.korsz[aria-pressed="true"] .ev{color:var(--accent-text)}
@media (max-width:700px){.idovonal{grid-template-columns:1fr 1fr}}
.abrawrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.5rem}
.abrawrap svg{width:100%;height:auto;display:block}
svg .csp rect{fill:var(--card2);stroke:var(--line);stroke-width:1.2}
svg .csp.sel rect{fill:var(--accent-bg);stroke:var(--accent);stroke-width:2}
svg .csp.halv{opacity:.35}
svg .csp.szuk rect{stroke:var(--danger);stroke-width:2.5}
svg .csp.hibas rect{fill:var(--danger-bg);stroke:var(--danger)}
svg .svn{fill:var(--text);font-size:15px;font-weight:600}
svg.abra .svn{font-size:19px}
svg.abra .svt{font-size:16px}
svg .svt.pp{fill:var(--danger)}
svg .svt{fill:var(--muted);font-size:13px}
svg .svt.keszl{fill:var(--aru)}
svg .svt.veszt{fill:var(--penz)}
svg .svt.veszt.fo{font-weight:700;fill:var(--danger)}
svg .svt.szukt{fill:var(--danger);font-weight:600}
svg .svt.hiany{fill:var(--danger)}
svg .svt.kesest{fill:var(--info);font-weight:600}
svg .kiemel{fill:var(--accent-bg);stroke:var(--accent);stroke-dasharray:6 4;opacity:.7}
svg .lsav{fill:var(--card2);stroke:var(--line)}
svg .pphatar{stroke:var(--danger);stroke-width:2;stroke-dasharray:4 4}
svg .fl{stroke-width:3;fill:none}
svg .fl.alap{stroke:var(--line);stroke-width:2}
svg .fl.aru{stroke:var(--aru)}
svg .fl.info{stroke:var(--info);stroke-width:2.5}
svg .fl.penz{stroke:var(--penz);stroke-width:2.5}
svg .fl.vissza{stroke:var(--aru);stroke-width:2;stroke-dasharray:3 5}
@media (prefers-reduced-motion: no-preference){
  svg .fl.on{stroke-dasharray:9 7;animation:folyik 1.1s linear infinite}
  svg .fl.vissza.on{stroke-dasharray:3 5;animation:folyik 1.8s linear infinite}
  svg.keses .fl.info.on{animation-duration:4.5s}
}
@keyframes folyik{to{stroke-dashoffset:-16}}
.kapcsolok{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.kapcs{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;background:var(--card)}
.kapcs[aria-pressed="true"]{border-color:currentColor}
.kapcs .pt{width:.7rem;height:.7rem;border-radius:50%;display:inline-block}
.kapcs.aru{color:var(--aru)}.kapcs.aru .pt{background:var(--aru)}
.kapcs.info{color:var(--info)}.kapcs.info .pt{background:var(--info)}
.kapcs.penz{color:var(--penz)}.kapcs.penz .pt{background:var(--penz)}
.kapcs.semleges{color:var(--text)}.kapcs.semleges .pt{background:var(--muted)}
.kapcs[aria-pressed="false"]{color:var(--muted)}
.kartya{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem}
.kartya h4{margin:0 0 .5rem}
.kartya dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.35rem .75rem;font-size:.95rem}
.kartya dt{color:var(--muted)}
.kartya dd{margin:0}
.fin{display:grid;gap:.6rem}
.fin label{display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr) 4rem;gap:.6rem;align-items:center;font-size:.9rem}
.finsor{display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr) 4rem;gap:.6rem;align-items:center;font-size:.9rem}
.fintrack{height:1.1rem;background:var(--card2);border-radius:6px;overflow:hidden}
.fintrack span{display:block;height:100%;border-radius:6px}
.fintrack .a{background:var(--aru)}.fintrack .b{background:var(--penz)}
.finszoveg{font-weight:600}
.lvl{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:860px){.lvl{grid-template-columns:1fr}}
.lvl h4{margin:0 0 .5rem}
.modkapcs{display:grid;gap:.45rem;margin-bottom:.8rem}
.modkapcs label{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;cursor:pointer;background:var(--card)}
.modkapcs label.on{border-color:var(--accent);background:var(--accent-bg)}
.modkapcs small{display:block;color:var(--muted)}
.szemlelt{font-size:.8rem;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:.15rem .5rem;display:inline-block}
.tanulsag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
@media (max-width:860px){.tanulsag{grid-template-columns:1fr}}
.tanulsag div{background:var(--card2);border-radius:12px;padding:.9rem 1rem}
.tanulsag b{display:block;font-size:1.05rem;margin-bottom:.3rem}
.onell{display:grid;gap:.75rem}
.onell .k{font-weight:600;margin-bottom:.35rem}
.onell .o{display:grid;gap:.35rem}
.onell .o button{text-align:left}
.onell .o button.jo{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.onell .o button.rossz{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.onell .m{font-size:.9rem;color:var(--muted);margin-top:.3rem}

/* ---------- 3–4. fázis kivetítő ---------- */
.csoportok{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.75rem}
.cskartya{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;display:grid;gap:.4rem}
.cskartya .fej{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.cskartya .nev{font-weight:600;font-size:1.05rem}
.cskartya .lepesek{display:flex;gap:.25rem}
.cskartya .lepesek span{flex:1;height:.45rem;border-radius:3px;background:var(--card2)}
.cskartya .lepesek span.kesz{background:var(--aru)}
.cskartya .lepesek span.akt{background:var(--accent)}
.cskartya .sor{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);gap:.5rem;flex-wrap:wrap}
.galeria{display:grid;gap:1rem}
.galkartya{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem}
.galkartya .fej{display:flex;gap:.75rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.25rem}
.galkartya .fej b{font-size:1.1rem}
.galkartya svg{width:100%;height:auto;display:block}
.mtab{width:100%;border-collapse:collapse;font-size:.92rem}
.mtab th,.mtab td{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.mtab th:first-child,.mtab td:first-child{text-align:left;white-space:normal}
.mtab th{color:var(--muted);font-weight:500}
.tabwrap{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow:auto}
.modal .ablak{background:var(--card);border-radius:14px;max-width:1100px;width:100%;padding:1rem 1.25rem}
.modal .ablak .fej{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.5rem}
.qrnagy{text-align:center}
.qrnagy .qrfeher{padding:16px}

/* ---------- hallgatói (telefon) nézet ---------- */
main.hallgato{max-width:560px;margin:0 auto;padding:14px 14px 48px}
.htop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px;gap:.5rem}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.prog span{display:block;height:100%;background:var(--accent);transition:width .3s}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hcard h1{font-size:20px;margin:0 0 6px}
.hcard h2{font-size:17px;margin:14px 0 8px}
.hcard p{margin:0 0 10px}
.hq{font-size:17px;font-weight:600;line-height:1.4;margin:0 0 14px}
.hopts{display:grid;gap:8px}
.hopt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:15px;line-height:1.35}
.hopt b{flex:0 0 auto;min-width:24px;height:24px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 6px}
.hopt.sel{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}

  if (mod === 'hallgato') hallgato(P);

})();
